// LogiOps — configuração do Logitech MX Master 3S
// Requer o daemon logid (ver linux/files/etc/systemd/system/logid.service).
// CIDs dos botões: use `logid -v` com o mouse conectado para descobrir outros.

devices: ({
    name: "MX Master 3S";

    buttons: (
        // Botão Voltar (polegar) = diminuir volume
        { cid: 0x53; action = { type: "Keypress"; keys: ["KEY_VOLUMEDOWN"]; }; },

        // Botão Avançar (polegar) = aumentar volume
        { cid: 0x56; action = { type: "Keypress"; keys: ["KEY_VOLUMEUP"]; }; },

        // Botão de gesto (apoio do polegar) = Super -> overview do GNOME
        { cid: 0xc3; action = { type: "Keypress"; keys: ["KEY_LEFTMETA"]; }; }
    );
});
