# MX Master 3S via Bluetooth: o driver hid_logitech_hidpp liga hi-res scroll e a rolagem
# fica lenta/atrasada no GNOME/navegador. Sem ele o BT se comporta igual ao receptor Bolt.
# logid (LogiOps) continua funcionando via hidraw. Para reverter: remover este arquivo e reiniciar.
blacklist hid_logitech_hidpp
install hid_logitech_hidpp /bin/true
