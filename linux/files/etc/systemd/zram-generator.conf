# zram — swap comprimido em RAM (systemd-zram-generator).
#
# Fica ACIMA dos arquivos de swap em disco (prioridade 100 × 10): o kernel
# manda páginas primeiro pro zram, que comprime ~3× com zstd e é dezenas de
# vezes mais rápido que disco. O swap em disco vira reserva.
#
# Tamanho = teto de dados NÃO comprimidos: metade da RAM, no máximo 8 GiB. Com
# compressão ~3×, 7 GiB de páginas ocupam ~2-2,5 GiB de RAM de verdade.
[zram0]
zram-size = min(ram / 2, 8192)
compression-algorithm = zstd
swap-priority = 100
