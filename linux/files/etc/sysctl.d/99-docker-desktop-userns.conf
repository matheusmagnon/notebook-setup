# Docker Desktop — o backend qemu precisa criar user namespaces não
# privilegiados; com a restrição AppArmor do Ubuntu (default =1; re-aplicada
# pelo upgrade pro 26.04 em nov/2026) ele crasha na inicialização:
#   qemu: process terminated unexpectedly: signal: aborted (core dumped)
# 0 volta ao comportamento pré-23.10 — workaround documentado nos fóruns
# Docker/Ubuntu. Trade-off: user namespaces irrestritos abrem mão de uma
# camada de hardening; aceito aqui porque o Docker Desktop é indispensável.
# Aplicar na hora: sudo sysctl --system
kernel.apparmor_restrict_unprivileged_userns = 0
