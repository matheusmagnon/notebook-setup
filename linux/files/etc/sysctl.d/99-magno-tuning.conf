# Tuning de kernel — notebook-setup
# Consolida o que antes estava espalhado em 99-swappiness.conf e 99-inotify.conf.

# --- Memória ---------------------------------------------------------------
# 14 GiB de RAM com uso pesado de Node/Chrome/Electron. O default 60 manda
# páginas pro swap cedo demais e o notebook engasga; 20 mantém mais coisa em
# RAM sem desligar o swap (0 desligaria, e aí o OOM killer entra mais rápido).
vm.swappiness = 20

# Prioriza reciclar cache de dentry/inode antes de páginas anônimas quando
# aperta. Ajuda em máquina com muito arquivo pequeno (node_modules, git).
vm.vfs_cache_pressure = 50

# --- Ferramentas de dev ----------------------------------------------------
# Watchers de arquivo (vite, webpack, tsc --watch, jest --watch). O default do
# Ubuntu estoura com poucos projetos abertos e o erro é críptico (ENOSPC).
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 512
