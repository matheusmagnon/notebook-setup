# Tuning de kernel — notebook-setup
# Revisão: 2026-11-18 — deep research (Tavily, 93 fontes: Arch Wiki, kernel
# docs, Phoronix, fóruns Fedora/openSUSE). Substitui swappiness=20 da
# mitigação de freeze antiga: com swap comprimido (zswap sobre swapfile), a
# doc do kernel endossa swappiness > 100 — trocar cedo e barato mantém o
# page cache (código) na RAM. Relatório completo: nov/2026.

# --- Memória (zswap sobre swapfile) ----------------------------------------
vm.swappiness = 180
vm.page-cluster = 0
vm.watermark_scale_factor = 125
vm.watermark_boost_factor = 0
vm.vfs_cache_pressure = 75

# --- Ferramentas de dev ------------------------------------------------------
# Watchers de arquivo (vite, webpack, tsc --watch, jest --watch). O default do
# Ubuntu estoura com poucos projetos abertos e o erro é críptico (ENOSPC).
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 512
