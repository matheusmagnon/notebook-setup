# tmux — resiliência de sessão: GUI cai/reinicia → processos seguem rodando.
# Uso diário: `ta` (attach-ou-cria a sessão main). Prefixo: Ctrl+B.
#   Ctrl+B |  split lado a lado      Ctrl+B -  split acima/abaixo
#   Ctrl+B c  nova janela             Ctrl+B 1..9  pular janela
#   Ctrl+B d  detach (sai sem matar)  Ctrl+B r  recarregar esta config
# Copy: mouse seleciona, y copia pro clipboard (Wayland).

set -g mouse on                 # scroll, seleção e redimensionar com mouse
set -g history-limit 100000     # sessões do Claude geram muito scroll
set -g base-index 1             # janelas contam de 1
setw -g pane-base-index 1
set -g renumber-windows on      # fechar a 2 → a 3 vira 2
setw -g mode-keys vi

# splits no ponto; novos panes/janelas herdam o diretório atual
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind c new-window -c "#{pane_current_path}"

# recarregar config sem sair da sessão
bind r source-file ~/.tmux.conf \; display "config recarregada"

# copy: y manda pro clipboard do Wayland; seleção com mouse também
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "wl-copy"

# status discreto (o verde default grita); só sessão + hora
set -g status-style "bg=default,fg=white"
set -g status-left "#[bold]#{session_name}#[nobold] "
set -g status-right "%H:%M "
set -g status-right-length 10
